[project]
name = "manga-web-translator"
version = "0.1.1"
description = "Local-first chapter translation for Chrome"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi==0.143.0", "uvicorn==0.54.0", "httpx==0.28.1",
 "pillow>=11.3,<13", "numpy<2", "opencv-python==4.11.0.86",
 "keyring==25.7.0", "mokuro==0.2.5", "manga-ocr==0.1.16",
 "rapidocr-onnxruntime==1.4.4", "torch==2.8.0", "torchvision==0.23.0",
 "transformers>=4.45,<5", "python-multipart>=0.0.20"
]
[dependency-groups]
dev = ["pytest>=8,<10", "pyinstaller==6.22.3", "psutil>=6"]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
